spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8082/realms/banking-demo
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      # 'validate' checks that the schema matches entity mappings but never alters it.
      # Use Flyway/Liquibase or schema.sql for schema changes.
      ddl-auto: validate
    # Show the generated SQL in your terminal so you can see it working
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: transaction-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer