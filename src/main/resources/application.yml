spring:
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      # 'validate' checks that the schema matches entity mappings but never alters it.
      # Use Flyway/Liquibase or schema.sql for schema changes.
      ddl-auto: validate
    # Show the generated SQL in your terminal so you can see it working
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true