spring:
  datasource:
    url: "jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS events_schema"
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: never  # Hibernate create-drop handles schema; schema.sql is for PostgreSQL only
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

logging:
  level:
    kafka: OFF
    org.apache.kafka: OFF
    state.change.logger: OFF
    kafka.log.LogManager: OFF
    kafka.server.ReplicaManager: OFF
    kafka.server.ReplicaFetcherManager: OFF
    kafka.server.ReplicaAlterLogDirsManager: OFF